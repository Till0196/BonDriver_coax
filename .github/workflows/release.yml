name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

env:
  ZIG_VERSION: "0.17.0"
  ZIG_PUBKEY: "RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U"
  ZIGBUILD_VERSION: "0.23.4"

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-gnullvm
            zigbuild: x86_64-pc-windows-gnullvm
            windows: true
          - target: i686-pc-windows-gnullvm
            zigbuild: i686-pc-windows-gnullvm
            windows: true
          - target: x86_64-unknown-linux-gnu
            zigbuild: x86_64-unknown-linux-gnu.2.17
          - target: aarch64-unknown-linux-gnu
            zigbuild: aarch64-unknown-linux-gnu.2.17
          - target: armv7-unknown-linux-gnueabihf
            zigbuild: armv7-unknown-linux-gnueabihf.2.17
          - target: i686-unknown-linux-gnu
            zigbuild: i686-unknown-linux-gnu.2.17
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ matrix.target }}
      ARCHIVE: BonDriver_coax-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Add the Rust target
        run: rustup target add "$TARGET"

      - name: Install zig
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          url="https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$RUNNER_TEMP/zig.tar.xz" "$url"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$RUNNER_TEMP/zig.tar.xz.minisig" "$url.minisig"
          minisign -Vm "$RUNNER_TEMP/zig.tar.xz" -x "$RUNNER_TEMP/zig.tar.xz.minisig" -P "$ZIG_PUBKEY"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-$ZIG_VERSION" >> "$GITHUB_PATH"

      - name: Install cargo-zigbuild
        run: cargo install --locked "cargo-zigbuild@$ZIGBUILD_VERSION"

      - name: Cross-build for Windows
        if: matrix.windows
        run: cargo zigbuild --release --target ${{ matrix.zigbuild }}

      - name: Cross-build for Linux
        if: ${{ !matrix.windows }}
        run: cargo zigbuild --release -p bondriver_coax --target ${{ matrix.zigbuild }}

      - name: Make the archive
        run: |
          out="target/$TARGET/release"
          mkdir -p "release/$ARCHIVE"
          cp LICENSE NOTICE README.md "release/$ARCHIVE/"
          cd release
          if [ "${{ matrix.windows }}" = true ]; then
            mkdir "$ARCHIVE/Plugins"
            cp "../$out/BonDriver_coax.dll" "../$out/winscard.dll" "../$out/bondriver-probe.exe" "$ARCHIVE/"
            cp "../$out/coax_plugin.dll" "$ARCHIVE/Plugins/coax.tvtp"
            zip -qr "$ARCHIVE.zip" "$ARCHIVE"
            shasum -a 256 "$ARCHIVE.zip" > "$ARCHIVE.zip.sha256"
          else
            cp "../$out/libBonDriver_coax.so" "$ARCHIVE/BonDriver_coax.so"
            tar -czf "$ARCHIVE.tar.gz" "$ARCHIVE"
            shasum -a 256 "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256"
          fi
          rm -r "$ARCHIVE"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" release/* \
            --repo "${{ github.repository }}" \
            --title "BonDriver_coax ${TAG#v}" \
            --generate-notes \
            --verify-tag \
            "${prerelease[@]}"
